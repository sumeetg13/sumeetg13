<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 74" width="640" height="74" role="img" aria-label="SPECIMENS">
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'SF Mono',Menlo,'Courier New',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.drip{transform-box:fill-box;transform-origin:50% 0;animation:drip ease-in infinite}
@keyframes drip{0%{transform:scaleY(.25)}70%{transform:scaleY(1)}100%{transform:scaleY(.25)}}
.drop{animation:fall ease-in infinite;opacity:0}
@keyframes fall{0%,66%{opacity:0;transform:translateY(0)}70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(140px)}}
.bub{animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(var(--rise));opacity:0}}
.band{animation:band linear infinite}
@keyframes band{to{transform:translateX(56px)}}
.pulse{animation:pulse 2.8s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{animation:flick 5s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}92%{opacity:.35}93%{opacity:1}95%{opacity:.5}96%{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter><mask id="bio-specimens" maskUnits="userSpaceOnUse" x="-40" y="-40" width="80" height="80"><circle cx="0" cy="-11" r="15" fill="#fff"/><circle cx="9.5" cy="5.5" r="15" fill="#fff"/><circle cx="-9.5" cy="5.5" r="15" fill="#fff"/><circle cx="0" cy="-15" r="10.5" fill="#000"/><circle cx="13" cy="7.5" r="10.5" fill="#000"/><circle cx="-13" cy="7.5" r="10.5" fill="#000"/><circle r="9.2" fill="none" stroke="#fff" stroke-width="3.2"/><rect x="-0.8" y="-13" width="1.6" height="13" fill="#000" transform="rotate(0)"/><rect x="-0.8" y="-13" width="1.6" height="13" fill="#000" transform="rotate(120)"/><rect x="-0.8" y="-13" width="1.6" height="13" fill="#000" transform="rotate(240)"/><circle r="3.4" fill="#000"/></mask>
<pattern id="hz-specimens" width="14" height="74" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)"><rect width="14" height="74" fill="#030503"/><rect width="7" height="74" fill="#39ff14"/></pattern>
</defs>
<rect x="1" y="1" width="638" height="72" rx="10" fill="#0b120b" stroke="#2f6b16" stroke-width="1.5"/>
<rect x="1" y="1" width="12" height="72" rx="4" fill="url(#hz-specimens)"/>
<g transform="translate(52,37)"><circle r="25" fill="#39ff14" class="pulse" filter="url(#glow)"/><g transform="scale(.7)"><g class="spin" fill="#030503"><rect x="-40" y="-40" width="80" height="80" mask="url(#bio-specimens)"/></g></g></g>
<text x="92" y="35" font-size="25" font-weight="800" fill="#39ff14" filter="url(#glow)" letter-spacing="1"><tspan fill="#2f6b16">03 //</tspan> SPECIMENS</text>
<text x="93" y="58" font-size="13" fill="#a8ff60" letter-spacing="1.5">experiments that escaped the lab  <tspan class="pulse" fill="#39ff14">· click to unseal ▸</tspan></text>

</svg>
