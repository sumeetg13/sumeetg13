<g class="spin-r"><circle cx="480" cy="168" r="53" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="1 5"/></g>
<circle cx="480" cy="168" r="50" fill="#0a0a0a" stroke="url(#gold-l)" stroke-width="2.4"/>
<circle cx="480" cy="168" r="41" fill="none" stroke="#8a6a1f" stroke-width=".8"/>
<circle class="glint" cx="480" cy="168" r="41" fill="none" pathLength="1000" stroke="#fff4c4" stroke-width="2" stroke-linecap="round"
  stroke-dasharray="120 1880" style="animation-duration:9s;animation-delay:-5.1s" filter="url(#glow-l)"/>
<text x="480" y="178" text-anchor="middle" font-size="23" font-weight="700" fill="url(#goldv-l)">MMXX</text>
