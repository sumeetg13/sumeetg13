<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70" role="img" aria-label="acid divider">
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'SF Mono',Menlo,'Courier New',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.drip{transform-box:fill-box;transform-origin:50% 0;animation:drip ease-in infinite}
@keyframes drip{0%{transform:scaleY(.25)}70%{transform:scaleY(1)}100%{transform:scaleY(.25)}}
.drop{animation:fall ease-in infinite;opacity:0}
@keyframes fall{0%,66%{opacity:0;transform:translateY(0)}70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(140px)}}
.bub{animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(var(--rise));opacity:0}}
.band{animation:band linear infinite}
@keyframes band{to{transform:translateX(56px)}}
.pulse{animation:pulse 2.8s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{animation:flick 5s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}92%{opacity:.35}93%{opacity:1}95%{opacity:.5}96%{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#39ff14" stop-opacity="0"/><stop offset=".5" stop-color="#39ff14"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter><mask id="bio-d" maskUnits="userSpaceOnUse" x="-40" y="-40" width="80" height="80"><circle cx="0" cy="-11" r="15" fill="#fff"/><circle cx="9.5" cy="5.5" r="15" fill="#fff"/><circle cx="-9.5" cy="5.5" r="15" fill="#fff"/><circle cx="0" cy="-15" r="10.5" fill="#000"/><circle cx="13" cy="7.5" r="10.5" fill="#000"/><circle cx="-13" cy="7.5" r="10.5" fill="#000"/><circle r="9.2" fill="none" stroke="#fff" stroke-width="3.2"/><rect x="-0.8" y="-13" width="1.6" height="13" fill="#000" transform="rotate(0)"/><rect x="-0.8" y="-13" width="1.6" height="13" fill="#000" transform="rotate(120)"/><rect x="-0.8" y="-13" width="1.6" height="13" fill="#000" transform="rotate(240)"/><circle r="3.4" fill="#000"/></mask>
</defs>
<rect x="60" y="14" width="880" height="3" fill="url(#l)" filter="url(#glow)"/>
<g transform="translate(60,16)"><path class="drip" d="M286,0 C288.7,10.3 290.1,20.6 289.5,25.3 A2.5,2.5 0 1 0 294.6,25.3 C294,20.6 295.4,10.3 298.1,0Z" fill="#39ff14" style="animation-duration:4.8s;animation-delay:-2.6s"/><circle class="drop" cx="292" cy="25.3" r="2.3" fill="#39ff14" style="animation-duration:4.8s;animation-delay:-2.6s"/></g>
<g transform="translate(60,16)"><path class="drip" d="M321.8,0 C324.2,9 325.4,18.1 324.9,22.2 A2.3,2.3 0 1 0 329.4,22.2 C328.9,18.1 330.2,9 332.6,0Z" fill="#39ff14" style="animation-duration:4.6s;animation-delay:-2.0s"/><circle class="drop" cx="327.2" cy="22.2" r="2.1" fill="#39ff14" style="animation-duration:4.6s;animation-delay:-2.0s"/></g>
<g transform="translate(60,16)"><path class="drip" d="M73,0 C75.6,8.3 76.9,16.6 76.3,20.5 A2.4,2.4 0 1 0 81,20.5 C80.5,16.6 81.8,8.3 84.3,0Z" fill="#39ff14" style="animation-duration:7.8s;animation-delay:-1.0s"/><circle class="drop" cx="78.7" cy="20.5" r="2.1" fill="#39ff14" style="animation-duration:7.8s;animation-delay:-1.0s"/></g>
<g transform="translate(60,16)"><path class="drip" d="M198.1,0 C202.4,12.8 204.5,25.7 203.6,31.6 A3.9,3.9 0 1 0 211.5,31.6 C210.5,25.7 212.7,12.8 216.9,0Z" fill="#39ff14" style="animation-duration:6.8s;animation-delay:-2.7s"/><circle class="drop" cx="207.5" cy="31.6" r="3.6" fill="#39ff14" style="animation-duration:6.8s;animation-delay:-2.7s"/></g>
<g transform="translate(60,16)"><path class="drip" d="M834.7,0 C837.1,12.1 838.3,24.2 837.8,29.7 A2.2,2.2 0 1 0 842.3,29.7 C841.8,24.2 843,12.1 845.4,0Z" fill="#39ff14" style="animation-duration:5.7s;animation-delay:-0.8s"/><circle class="drop" cx="840.1" cy="29.7" r="2" fill="#39ff14" style="animation-duration:5.7s;animation-delay:-0.8s"/></g>
<g transform="translate(60,16)"><path class="drip" d="M111.8,0 C115,11.7 116.7,23.4 115.9,28.8 A3,3 0 1 0 122,28.8 C121.2,23.4 122.9,11.7 126.1,0Z" fill="#39ff14" style="animation-duration:5.2s;animation-delay:-3.0s"/><circle class="drop" cx="118.9" cy="28.8" r="2.7" fill="#39ff14" style="animation-duration:5.2s;animation-delay:-3.0s"/></g>
<g transform="translate(60,16)"><path class="drip" d="M549.1,0 C552.5,9.4 554.3,18.8 553.5,23.1 A3.2,3.2 0 1 0 559.9,23.1 C559.1,18.8 560.9,9.4 564.3,0Z" fill="#39ff14" style="animation-duration:4.8s;animation-delay:-0.3s"/><circle class="drop" cx="556.7" cy="23.1" r="2.9" fill="#39ff14" style="animation-duration:4.8s;animation-delay:-0.3s"/></g>
<g transform="translate(60,16)"><path class="drip" d="M183.2,0 C187.6,8.4 189.9,16.7 188.9,20.5 A4.1,4.1 0 1 0 197.1,20.5 C196.1,16.7 198.4,8.4 202.8,0Z" fill="#39ff14" style="animation-duration:5.8s;animation-delay:-3.4s"/><circle class="drop" cx="193" cy="20.5" r="3.7" fill="#39ff14" style="animation-duration:5.8s;animation-delay:-3.4s"/></g>
<g transform="translate(60,16)"><path class="drip" d="M393.6,0 C396.8,11.5 398.4,23 397.7,28.3 A3,3 0 1 0 403.7,28.3 C402.9,23 404.6,11.5 407.8,0Z" fill="#39ff14" style="animation-duration:7.3s;animation-delay:-1.8s"/><circle class="drop" cx="400.7" cy="28.3" r="2.7" fill="#39ff14" style="animation-duration:7.3s;animation-delay:-1.8s"/></g>
<g transform="translate(500,16)"><circle r="15" fill="#39ff14" filter="url(#glow)"/><g transform="scale(.42)"><g class="spin" fill="#030503"><rect x="-40" y="-40" width="80" height="80" mask="url(#bio-d)"/></g></g></g>

</svg>
