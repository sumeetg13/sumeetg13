name: daily haiku

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writer
  cancel-in-progress: false

jobs:
  haiku:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/haiku.py
      - name: Commit if the haiku changed
        run: |
          git config user.name "sakura-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git commit -am "🌸 today's haiku"
          git pull --rebase && git push
