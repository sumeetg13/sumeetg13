name: sakura snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sakura-snake.svg?color_snake=#e75480&color_dots=#f6eef1,#fbd0e0,#f7a1c4,#ee6fa3,#c2185b
            dist/sakura-snake-dark.svg?palette=github-dark&color_snake=#ffb7c5&color_dots=#161b22,#4a1d34,#7a2e55,#c2557f,#f48fb1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
